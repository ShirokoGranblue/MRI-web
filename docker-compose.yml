services:
  mysql:
    image: mysql:8.0
    container_name: mri-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: mri_cloud
      MYSQL_USER: mri
      MYSQL_PASSWORD: mri123456
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mri-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-hmysql", "-umri", "-pmri123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: mri-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mri-redis-data:/data

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: mri-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - mri-nacos-data:/home/nacos/data

  minio:
    image: minio/minio:latest
    container_name: mri-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mri
      MINIO_ROOT_PASSWORD: mri123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mri-minio-data:/data

volumes:
  mri-mysql-data:
  mri-redis-data:
  mri-nacos-data:
  mri-minio-data:
